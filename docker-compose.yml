services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped

    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/config"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Ningun router escucha en web (:80): todo lo que llega por HTTP se
      # redirige a HTTPS en vez de responder 404.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Entrypoint interno para el trafico entre servicios (orquestador ->
      # pdf-extractext y orquestador -> document-store). NO va en ports: solo
      # lo alcanzan los contenedores de la red del stack. Pasar por Traefik le
      # da balanceo real entre replicas y el circuit breaker (ver las labels
      # de cada servicio).
      - "--entrypoints.internal.address=:${TRAEFIK_INTERNAL_PORT:-8081}"

    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./config:/config:ro"
      - "./certs:/certs:ro"

    # Router interno hacia document-store. Va en las labels de traefik y no en
    # las de document-store a proposito: Traefik arma los routers de Docker
    # con los contenedores que estan corriendo, asi que con document-store
    # parado su router desapareceria y Traefik responderia 404 (que el
    # orquestador leeria como "documento no encontrado"), sin pasar nunca por
    # el circuit breaker. Definido aca existe siempre: con document-store
    # caido la conexion falla, el circuit breaker lo cuenta y abre el
    # circuito (503 al instante). document-store tiene una sola replica, asi
    # que no se pierde balanceo. Solo escucha en el entrypoint interno: desde
    # afuera document-store sigue sin ser accesible.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.document-store-internal.rule=PathPrefix(`/api/v1/documents`)"
      - "traefik.http.routers.document-store-internal.entrypoints=internal"
      - "traefik.http.routers.document-store-internal.service=document-store"
      - "traefik.http.routers.document-store-internal.middlewares=cb-document-store"
      - "traefik.http.services.document-store.loadbalancer.server.url=http://document-store:${DOCUMENT_STORE_PORT:-8000}"
      # Aca el 503 si cuenta: document-store lo devuelve cuando MongoDB no
      # responde. Sin middleware retry: un POST reintentado podria convertir
      # un 201 en 409 (documento duplicado).
      - "traefik.http.middlewares.cb-document-store.circuitbreaker.expression=NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 600, 0, 600) > 0.25"
      - "traefik.http.middlewares.cb-document-store.circuitbreaker.checkperiod=1s"
      - "traefik.http.middlewares.cb-document-store.circuitbreaker.fallbackduration=30s"
      - "traefik.http.middlewares.cb-document-store.circuitbreaker.recoveryduration=10s"
      # Respaldo de /extract para cuando no queda ninguna replica sana de
      # pdf-extractext: sin replicas desaparece el router extract-internal (se
      # arma con las labels de cada replica) y sin este respaldo Traefik
      # responderia 404. Prioridad 1: solo atiende si extract-internal no
      # existe. Mismo criterio de circuit breaker que cb-extract.
      - "traefik.http.routers.extract-internal-respaldo.rule=PathPrefix(`/extract`)"
      - "traefik.http.routers.extract-internal-respaldo.entrypoints=internal"
      - "traefik.http.routers.extract-internal-respaldo.priority=1"
      - "traefik.http.routers.extract-internal-respaldo.service=extract-respaldo"
      - "traefik.http.routers.extract-internal-respaldo.middlewares=cb-extract-respaldo"
      - "traefik.http.services.extract-respaldo.loadbalancer.server.url=http://pdf-extractext:${PDF_EXTRACTEXT_PORT:-8000}"
      - "traefik.http.middlewares.cb-extract-respaldo.circuitbreaker.expression=NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 503, 0, 600) > 0.25 || ResponseCodeRatio(504, 600, 0, 600) > 0.25"
      - "traefik.http.middlewares.cb-extract-respaldo.circuitbreaker.checkperiod=1s"
      - "traefik.http.middlewares.cb-extract-respaldo.circuitbreaker.fallbackduration=30s"
      - "traefik.http.middlewares.cb-extract-respaldo.circuitbreaker.recoveryduration=10s"

  orchestrator:
    build:
      context: ../orchestrator-service
      dockerfile: Dockerfile
    # 12-Factor V: cada release es una imagen con su version, no un latest
    # que se pisa en cada build.
    image: orchestrator-service:${ORCHESTRATOR_TAG:?definir ORCHESTRATOR_TAG en .env (ver .env.example)}

    restart: unless-stopped
    # 12-Factor IX (apagado ordenado). Ante SIGTERM uvicorn deja de aceptar
    # conexiones y espera las requests en curso hasta GRACEFUL_SHUTDOWN_SECONDS
    # (60 s): lo mismo que puede tardar una request esperando a pdf-extractext
    # (HTTP_TIMEOUT_SECONDS=60 en docker-compose.override.yml). Docker manda
    # SIGKILL recien a los 70 s: 10 s de margen para cerrar el lifespan.
    stop_grace_period: 70s

    environment:
      HOST: 0.0.0.0
      # Menor que stop_grace_period (ver arriba).
      GRACEFUL_SHUTDOWN_SECONDS: 60
      # Puerto del orquestador: lo usan uvicorn (main.py lee PORT), el
      # healthcheck y la label de Traefik. Una sola variable para los tres.
      PORT: ${ORCHESTRATOR_PORT:-8000}
      # Las dos llamadas salen por el entrypoint interno de Traefik
      # (TRAEFIK_INTERNAL_PORT): Traefik balancea entre las replicas y aplica
      # el circuit breaker de cada servicio. Cada router interno elige el
      # servicio por el path (/extract o /api/v1/documents).
      PDF_EXTRACT_BASE_URL: http://traefik:${TRAEFIK_INTERNAL_PORT:-8081}
      DOCUMENT_STORE_BASE_URL: http://traefik:${TRAEFIK_INTERNAL_PORT:-8081}
      # Traefik termina TLS y manda X-Forwarded-Proto/For: el orquestador solo
      # los acepta de la red del stack (misma subred que networks.default), no
      # de cualquier origen. Sin esto usa 127.0.0.1 y las URLs que arma (p. ej.
      # "instance" de los Problem Details) salen con http:// en vez de https://.
      FORWARDED_ALLOW_IPS: ${STACK_SUBNET:-172.28.0.0/16}

    # Orden de arranque: mongo -> document-store -> pdf-extractext ->
    # orchestrator. El orquestador es el ultimo: extrae con pdf-extractext y
    # guarda con document-store (ADR-0003 del orquestador), asi que sin alguno
    # de los dos cada upload falla.
    depends_on:
      # Las llamadas a los dos servicios pasan por Traefik.
      traefik:
        condition: service_started
      document-store:
        condition: service_healthy
      pdf-extractext:
        condition: service_healthy

    # Reemplaza el HEALTHCHECK del Dockerfile del orquestador: mismo chequeo
    # liviano que los demas servicios (socket, sin cargar ssl ni email) y cada
    # 1 s mientras arranca, para que Traefik le mande trafico enseguida
    # (Traefik ignora los contenedores que todavia no estan healthy).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-S",
          "-I",
          "-c",
          "import os, socket; s = socket.create_connection(('127.0.0.1', int(os.environ['PORT'])), 2); s.sendall(b'GET /health HTTP/1.0\\r\\n\\r\\n'); raise SystemExit(0 if b' 200 ' in s.recv(64) else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`orchestrator.proyecto.localhost`)"
      - "traefik.http.routers.orchestrator.entrypoints=websecure"
      - "traefik.http.routers.orchestrator.tls=true"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=${ORCHESTRATOR_PORT:-8000}"
      # Rate limit (patron Rate Limiting): cada IP de origen puede hacer en
      # promedio RATE_LIMIT_AVERAGE requests por segundo, con rafagas de hasta
      # RATE_LIMIT_BURST. Lo que pasa del limite recibe 429 Too Many Requests
      # de Traefik, sin llegar al orquestador: protege a las replicas, a
      # pdf-extractext (cada upload es una extraccion) y a document-store de un
      # cliente que abusa. Solo en la entrada publica: las rutas internas entre
      # servicios y /extract del TP (extract.proyecto.localhost) no se limitan.
      - "traefik.http.middlewares.orchestrator-ratelimit.ratelimit.average=${RATE_LIMIT_AVERAGE:-20}"
      - "traefik.http.middlewares.orchestrator-ratelimit.ratelimit.burst=${RATE_LIMIT_BURST:-40}"
      - "traefik.http.middlewares.orchestrator-ratelimit.ratelimit.period=1s"
      - "traefik.http.routers.orchestrator.middlewares=orchestrator-ratelimit"

  pdf-extractext:
    build:
      context: ../pdf-extractext
      dockerfile: docker/Dockerfile
    image: pdf-extractext:${PDF_EXTRACTEXT_TAG:?definir PDF_EXTRACTEXT_TAG en .env (ver .env.example)}

    # Sin container_name: con un nombre fijo Docker no puede crear replicas.
    # El orquestador lo sigue encontrando por el nombre del servicio.
    restart: unless-stopped
    # Ante SIGTERM termina lo que tiene en cola (hasta 28 s de espera por
    # request) antes de que Docker mande SIGKILL.
    stop_grace_period: 35s

    deploy:
      # Maximo que permite la consigna del TP.
      replicas: 5
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

    # Orden de arranque que pidio la catedra: documentos, extraccion y por
    # ultimo el orquestador. pdf-extractext NO necesita a document-store para
    # funcionar (no lo llama nunca): esperarlo es solo el orden de arranque.
    # Una caida posterior de document-store o de MongoDB no lo afecta.
    depends_on:
      document-store:
        condition: service_healthy

    # Desde la 2.0.0 no usa base de datos (ADR-0008 de pdf-extractext): solo
    # extrae. Por eso no recibe DATABASE_*.
    environment:
      HOST: 0.0.0.0
      # Mismo valor para PORT, el healthcheck, la label de Traefik y la URL
      # que usa el orquestador.
      PORT: ${PDF_EXTRACTEXT_PORT:-8000}
      MAX_PDF_SIZE_BYTES: 10485760

    # Chequeo liviano: python sin site ni imports pesados (-S -I) y un socket
    # en lugar de urllib, que carga ssl y email. Medido en reposo: urllib cada
    # 5 s gastaba 12 % de un nucleo por replica; asi, cada 10 s, ~3 %. Al
    # arrancar chequea cada 1 s para volver rapido al balanceo. El puerto sale
    # de PORT (os es un modulo congelado: no cambia el costo del chequeo).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-S",
          "-I",
          "-c",
          "import os, socket; s = socket.create_connection(('127.0.0.1', int(os.environ['PORT'])), 2); s.sendall(b'GET /health HTTP/1.0\\r\\n\\r\\n'); raise SystemExit(0 if b' 200 ' in s.recv(64) else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

    labels:
      # POST /extract directo desde Traefik, sin pasar por el orquestador:
      # cada salto de red suma latencia al camino que mide el TP.
      - "traefik.enable=true"
      - "traefik.http.routers.extract.rule=Host(`extract.proyecto.localhost`) && PathPrefix(`/extract`)"
      - "traefik.http.routers.extract.entrypoints=websecure"
      - "traefik.http.routers.extract.tls=true"
      - "traefik.http.services.extract.loadbalancer.server.port=${PDF_EXTRACTEXT_PORT:-8000}"
      # Si una replica se cae o se esta apagando, reintenta en otra. Es seguro
      # porque /extract no guarda estado: procesar dos veces el mismo PDF no
      # cambia nada. El orquestador, en cambio, no reintenta sus POST (podrian
      # duplicar trabajo): solo reintenta fallos de conexion.
      - "traefik.http.middlewares.extract-reintento.retry.attempts=3"
      - "traefik.http.middlewares.extract-reintento.retry.initialinterval=100ms"
      - "traefik.http.routers.extract.middlewares=extract-reintento"
      - "traefik.http.routers.extract.service=extract"
      # Router interno: el que usa el orquestador (entrypoint internal, sin
      # publicar en el host). Primero el circuit breaker y despues el retry:
      # con el circuito abierto Traefik responde 503 sin llamar a ninguna
      # replica ni reintentar.
      - "traefik.http.routers.extract-internal.rule=PathPrefix(`/extract`)"
      - "traefik.http.routers.extract-internal.entrypoints=internal"
      # Por encima del respaldo que esta en las labels de traefik.
      - "traefik.http.routers.extract-internal.priority=10"
      - "traefik.http.routers.extract-internal.service=extract"
      - "traefik.http.routers.extract-internal.middlewares=cb-extract,extract-reintento"
      # Circuit breaker: abre el circuito con mas de 30 % de errores de red o
      # mas de 25 % de respuestas 5xx, medidos cada checkperiod. El 503 queda
      # afuera a proposito: es el backpressure de pdf-extractext (cola llena,
      # con Retry-After), no una falla. Abierto, responde 503 durante
      # fallbackduration; despues deja pasar trafico de a poco durante
      # recoveryduration y, si no falla, vuelve a cerrarse.
      - "traefik.http.middlewares.cb-extract.circuitbreaker.expression=NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 503, 0, 600) > 0.25 || ResponseCodeRatio(504, 600, 0, 600) > 0.25"
      - "traefik.http.middlewares.cb-extract.circuitbreaker.checkperiod=1s"
      - "traefik.http.middlewares.cb-extract.circuitbreaker.fallbackduration=30s"
      - "traefik.http.middlewares.cb-extract.circuitbreaker.recoveryduration=10s"

  document-store:
    build:
      context: ../document-store
      dockerfile: Dockerfile
    image: document-store:${DOCUMENT_STORE_TAG:?definir DOCUMENT_STORE_TAG en .env (ver .env.example)}

    # Sin container_name, igual que pdf-extractext: deja escalarlo con
    # --scale y el orquestador lo encuentra por el nombre del servicio.
    restart: unless-stopped
    # 12-Factor IX. Requests cortas (consultas e inserts en MongoDB con timeout
    # de 3 s): uvicorn espera hasta GRACEFUL_SHUTDOWN_SECONDS (10 s) y Docker
    # manda SIGKILL recien a los 15 s, con margen para cerrar el cliente de Mongo.
    stop_grace_period: 15s

    environment:
      HOST: 0.0.0.0
      # Menor que stop_grace_period (ver arriba).
      GRACEFUL_SHUTDOWN_SECONDS: 10
      # Mismo valor para PORT, el healthcheck y la URL que usa el orquestador.
      PORT: ${DOCUMENT_STORE_PORT:-8000}
      # Mismo MongoDB del stack, con su propia base: los documentos guardados
      # no se mezclan con los de pdf_extract. Credenciales desde .env
      # (12-Factor III); si la clave tiene @ : / ? va URL-encoded.
      DATABASE_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      DATABASE_NAME: document_store
      DATABASE_TIMEOUT_MS: 3000
      # Cache de documentos (patron Cache-Aside, ver el README de
      # document-store): GET /api/v1/documents/{id} responde desde Redis sin
      # consultar MongoDB. Redis es otro backing service (12-Factor IV), con su
      # clave desde .env. Si Redis no responde, document-store lee de MongoDB
      # (en REDIS_TIMEOUT_MS): el cache nunca es un punto de falla.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CACHE_TTL_SECONDS: 300
      REDIS_TIMEOUT_MS: 500

    # Sin depender de redis a proposito: document-store funciona sin cache.
    depends_on:
      mongo:
        condition: service_healthy

    # Reemplaza el HEALTHCHECK del Dockerfile (urllib cada 30 s): pdf-extractext
    # y el orquestador esperan a que este healthy, y con 30 s de intervalo
    # tardarian medio minuto en arrancar. Mismo chequeo liviano que los demas
    # (socket, sin cargar ssl ni email) y cada 1 s mientras arranca.
    # Usa /ready (readiness): hace ping a MongoDB y responde 503 si la base no
    # contesta, asi que con Mongo caido document-store pasa a unhealthy y
    # Traefik/compose lo ven. El ping falla en DATABASE_TIMEOUT_MS (3 s), menos
    # que el timeout del chequeo (5 s). /health (liveness) no toca la base.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-S",
          "-I",
          "-c",
          "import os, socket; s = socket.create_connection(('127.0.0.1', int(os.environ['PORT'])), 2); s.sendall(b'GET /ready HTTP/1.0\\r\\n\\r\\n'); raise SystemExit(0 if b' 200 ' in s.recv(64) else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

    # Sin labels de Traefik: el router interno que lo alcanza esta definido en
    # las labels de traefik (ver ahi por que). Desde afuera no es accesible.

  # Hoy lo usa solo document-store (base document_store). pdf-extractext ya
  # no guarda nada desde su 2.0.0.
  mongo:
    # Version completa (no un tag flotante como 7-jammy): la misma imagen en
    # cada build. 8.0 es la rama de soporte largo y el salto desde un volumen
    # 7.0 esta soportado (ver "Actualizar MongoDB" en el README).
    image: mongo:8.0.34
    container_name: mongo
    restart: unless-stopped

    environment:
      # Obligatorias: sin .env el stack no arranca, en vez de usar una clave
      # escrita en el codigo. Ver .env.example.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?definir MONGO_ROOT_USERNAME en .env (ver .env.example)}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?definir MONGO_ROOT_PASSWORD en .env (ver .env.example)}
      # Sin MONGO_INITDB_DATABASE: solo sirve para los scripts de
      # /docker-entrypoint-initdb.d, y no hay ninguno. MongoDB crea la base
      # document_store sola cuando document-store la usa.

    volumes:
      - mongo_data:/data/db

    healthcheck:
      # $$ escapa la interpolacion de compose: las variables las expande el
      # shell dentro del contenedor, con las credenciales que ya tiene Mongo.
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Cache de document-store. Solo guarda copias con vencimiento (la fuente de
  # verdad es MongoDB): sin volumen ni snapshots, y con memoria acotada que
  # descarta lo menos usado (allkeys-lru) en lugar de rechazar escrituras.
  # Sin ports: solo lo alcanza document-store dentro de la red del stack.
  redis:
    image: redis:8.10.3-alpine
    container_name: redis
    restart: unless-stopped

    environment:
      # Obligatoria, como la de MongoDB (12-Factor III). Ver .env.example.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env (ver .env.example)}

    # La clave se pasa desde la variable dentro del contenedor ($$ evita que
    # compose la expanda), no escrita en el comando.
    command:
      [
        "sh",
        "-c",
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no',
      ]

    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mongo_data:

# Red del stack con subred fija: el orquestador solo confia en los headers
# X-Forwarded-* que vienen de esta red (Traefik), ver FORWARDED_ALLOW_IPS.
# 172.28.0.0/16 no choca con las redes que crea Docker por defecto
# (172.17-172.2x); si choca con otra red de la maquina, cambiar STACK_SUBNET
# en .env (y hacer docker compose down para recrear la red).
networks:
  default:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-172.28.0.0/16}